[project]
name = "talent-iq-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "openai>=1.60.0",
    "asyncpg>=0.32.0",
    "docling>=2.40.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "fpdf2>=2.8.0",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.4",
    "torch",
    "torchvision",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.54.0",
    "langgraph>=1.2.16",
    "mammoth>=1.13.0",
    "google-cloud-storage>=3.17.1",
]

# CPU-only PyTorch for Docling (avoids multi-GB CUDA wheels in the image)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["src/data/migrations", "docling-models"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import order, bugbear, modern-python upgrades
select = ["F", "E", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() defaults
    "E501",   # long lines: some prompts and SQL read better unbroken
    "UP042",  # keep (str, Enum): StrEnum changes str() output used in stored values
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
