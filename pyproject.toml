[project]
name = "talent-iq-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "openai>=1.60.0",
    "asyncpg>=0.32.0",
    "docling>=2.40.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "fpdf2>=2.8.0",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.4",
    "torch",
    "torchvision",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.54.0",
    "xlsxwriter>=3.2.0",
]

# CPU-only PyTorch for Docling (avoids multi-GB CUDA wheels in the image)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
